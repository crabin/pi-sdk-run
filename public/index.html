<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DataAgent · 流式对话</title>
<style>:root{--bg:#0d1016;--surface:#171b24;--surface2:#222837;--accent:#62a8ff;--text:#e9edf5;--dim:#929bab;--line:#2a3140;--tool:#142828;--tool-bd:#285050;--ok:#62c47c;--code:#0a0d12}*{box-sizing:border-box}body{margin:0;font-family:"Avenir Next","PingFang SC","Microsoft YaHei",sans-serif;background:radial-gradient(circle at 50% -25%,#1b2638 0,transparent 42%),var(--bg);color:var(--text);height:100vh;display:flex;flex-direction:column;overflow:hidden}#header{background:rgba(23,27,36,.9);backdrop-filter:blur(14px);padding:10px 18px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:16px;border-bottom:1px solid var(--line)}h1{font-size:15px}h1 span{color:var(--accent)}#agent-picker{display:flex;align-items:center;gap:9px}#agent{background:var(--bg);border:1px solid #3a4354;border-radius:7px;padding:7px 10px;color:var(--text)}#agent-description{font-size:12px;color:var(--dim);max-width:320px}#status{justify-self:end;font-size:13px;color:var(--dim);display:flex;align-items:center;gap:6px}#dot{width:8px;height:8px;border-radius:50%;background:var(--ok)}#dot.busy{background:#ffb454;animation:pulse .8s infinite}@keyframes pulse{50%{opacity:.3}}#chat{flex:1;overflow:auto;padding:28px max(18px,calc((100vw - 1040px)/2));display:flex;flex-direction:column;gap:18px;scroll-behavior:smooth}.bubble,.tool,.think{flex-shrink:0}.bubble{max-width:82%;padding:12px 16px;border-radius:12px;line-height:1.68}.bubble.user{align-self:flex-end;background:var(--surface2);white-space:pre-wrap}.bubble.ai{align-self:flex-start;background:var(--surface);border:1px solid rgba(255,255,255,.035);box-shadow:0 12px 36px rgba(0,0,0,.14)}.bubble.error,.t-res.err{color:#ff7272}.bubble.markdown-body{align-self:center;width:min(100%,860px);padding:22px 26px;overflow:hidden;color:#dce2ec}.markdown-body>:first-child{margin-top:0}.markdown-body>:last-child{margin-bottom:0}.markdown-body p{margin:0 0 1em}.markdown-body h1,.markdown-body h2,.markdown-body h3,.markdown-body h4{color:#f6f8fb;line-height:1.3;margin:1.55em 0 .65em;letter-spacing:-.018em}.markdown-body h1{font-size:1.55rem;padding-bottom:.4em;border-bottom:1px solid var(--line)}.markdown-body h2{font-size:1.3rem}.markdown-body h3{font-size:1.1rem}.markdown-body h4{font-size:1rem}.markdown-body ul,.markdown-body ol{margin:.55em 0 1em;padding-left:1.55em}.markdown-body li{margin:.3em 0;padding-left:.2em}.markdown-body li::marker{color:var(--accent)}.markdown-body blockquote{margin:1.1em 0;padding:.6em 1em;border-left:3px solid var(--accent);background:#111722;color:#b9c5d5;white-space:pre-line}.markdown-body a{color:#83bcff;text-underline-offset:3px}.markdown-body img{display:block;max-width:100%;margin:1em 0;border-radius:8px}.markdown-body :not(pre)>code{padding:.16em .4em;border:1px solid #30394a;border-radius:5px;background:#10151e;color:#ffca85;font:90% ui-monospace,SFMono-Regular,Consolas,monospace}.markdown-body hr{border:0;border-top:1px solid var(--line);margin:1.6em 0}.code-frame{margin:1.15em 0;border:1px solid #293140;border-radius:9px;background:var(--code);overflow:hidden}.code-bar{height:36px;padding:0 9px 0 14px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #222936;color:#778296;font:11px ui-monospace,SFMono-Regular,Consolas,monospace;text-transform:uppercase;letter-spacing:.08em}.copy-code{height:25px;padding:0 9px;border:1px solid #343e50;border-radius:5px;background:#151b25;color:#b7c0ce;font:12px inherit}.copy-code:hover{color:white;border-color:#526078}.code-frame pre{margin:0;padding:16px 18px;overflow:auto;line-height:1.58;tab-size:2}.code-frame pre code{font:13px ui-monospace,SFMono-Regular,Consolas,monospace;color:#d8dee9;white-space:pre}.table-wrap{max-width:100%;margin:1.1em 0;overflow:auto;border:1px solid var(--line);border-radius:8px}.markdown-body table{width:100%;border-collapse:collapse;font-size:14px}.markdown-body th,.markdown-body td{padding:9px 12px;text-align:left;border-right:1px solid var(--line);border-bottom:1px solid var(--line);white-space:nowrap}.markdown-body th{background:#202633;color:#f1f4f9}.markdown-body tr:last-child td{border-bottom:0}.tool{align-self:flex-start;background:var(--tool);border:1px solid var(--tool-bd);border-radius:8px;padding:9px 13px;max-width:80%}.t-head{color:#5fd2dd;font-weight:600}.t-args,.t-status{font-size:12px;color:var(--dim);word-break:break-all}.t-res{margin-top:8px;padding-top:8px;border-top:1px solid var(--tool-bd);white-space:pre-wrap}.think{align-self:flex-start;background:#282719;border-radius:8px;padding:7px 13px;color:#aaa;font-style:italic;white-space:pre-wrap}.loading span{display:inline-block;width:5px;height:5px;background:var(--dim);border-radius:50%;margin-left:3px}#input{background:rgba(23,27,36,.94);border-top:1px solid var(--line);padding:12px max(18px,calc((100vw - 1040px)/2));display:flex;gap:9px}#msg{flex:1;resize:none;background:var(--bg);border:1px solid #3a4354;border-radius:8px;padding:11px 13px;color:var(--text);font:inherit}#msg:focus{outline:2px solid rgba(98,168,255,.2);border-color:var(--accent)}button{border:0;border-radius:7px;padding:0 18px;font-weight:600;cursor:pointer}button:disabled,#agent:disabled{opacity:.55;cursor:not-allowed}#send{background:var(--accent);color:#07111e}#stop{display:none;background:#3a4354;color:var(--text)}#hint{text-align:center;color:var(--dim);margin:auto}@media(max-width:720px){#header{grid-template-columns:1fr auto}#agent-picker{grid-column:1/-1;grid-row:2}#agent-description{max-width:none}#chat{padding:18px 12px}.bubble{max-width:94%}.bubble.markdown-body{width:100%;padding:17px}.markdown-body h1{font-size:1.35rem}#input{padding:10px 12px}}</style></head>
<style>.bubble.markdown-body{align-self:flex-start}</style>
<body><div id="header"><h1>DataAgent <span>· 流式对话</span></h1><div id="agent-picker"><select id="agent" aria-label="Agent" disabled><option>加载中…</option></select><span id="agent-description"></span></div><div id="status"><span id="dot"></span><span id="status-text">正在加载 Agent…</span></div></div><div id="chat"><div id="hint">向数据分析助手提问，工具调用会显示成卡片<br>试试：「华东地区笔记本卖了多少？」</div></div><div id="input"><textarea id="msg" rows="1" placeholder="输入消息…（Enter 发送，Shift+Enter 换行）" disabled></textarea><button id="send" disabled>发送</button><button id="stop">停止</button></div><script type="module" src="/app.js"></script></body></html>
